<!-- Top App Navigation Bar -->

<div class="flex items-center gap-3">
<button aria-label="Open navigation menu" class="w-10 h-10 flex items-center justify-center rounded-xl bg-surface-container-low text-on-surface active:scale-95 transition-transform" type="button">

<div class="h-7 w-24 flex items-center">
<img alt="LeadZam Logo" class="h-full w-auto object-contain" src="https://lh3.googleusercontent.com/aida-public/AB6AXuBzu5w_nexiwWB3mraibm1k5-Z_wrEiePSSzLAX52BimLW46fbBMDMfV4TD3xPh5Miku2J4ikzgxrT9ZsCZHIitJGudx9qKq0fND-UPCIyxYKRoP553N7PEWV8tuDczW2aGosTlYklhN0sG9_4gkMKZ9OZOmpZ1ql2X5k-NHgfU5osdrVaHN8cv2pnLmr5EcKvnNU6p00n-v5LHUjVhXxrf9ruhzbXEz8WjA7AzDFRHRNLt1WL5OsbqgQ"/>

</div>
</div>
</header>
<!-- Page Header: Title & Search -->
<section class="mt-4 mb-3">
<div class="flex items-center justify-between mb-3">
<h1 class="font-section-title-mobile text-section-title-mobile text-on-surface tracking-tight">Leads</h1>
<span class="px-2.5 py-1 rounded-full bg-surface-container font-eyebrow text-eyebrow text-secondary">0 Loaded</span>
</div>
<!-- Search Bar (Disabled state during connection drop) -->
<div class="relative w-full">
<div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-outline">
<span class="material-symbols-outlined text-[20px]">search</span>

<input class="w-full h-11 pl-10 pr-10 rounded-xl bg-surface-container-low text-on-surface opacity-60 cursor-not-allowed font-body-sm text-body-sm focus:outline-none" disabled="" placeholder="Search leads by name, email, or tag..." type="text"/>
<div class="absolute inset-y-0 right-0 pr-3 flex items-center pointer-events-none text-outline">
<span class="material-symbols-outlined text-[18px]">tune</span>
</div>
</div>
</section>
<!-- Main Error Canvas -->
<section class="mt-6 flex flex-col items-center justify-center text-center px-2 py-6 rounded-2xl bg-surface-container-lowest shadow-sm">
<!-- Playful Yet Professional Pulse & Warning Badge -->
<div class="relative mb-5 flex items-center justify-center">
<div class="absolute w-20 h-20 rounded-full bg-error-container/40 animate-ping opacity-75"></div>
<div class="relative w-16 h-16 rounded-2xl bg-surface-container-low flex items-center justify-center shadow-inner">
<div class="w-12 h-12 rounded-xl bg-error-container flex items-center justify-center text-error">
<span class="material-symbols-outlined text-[28px]" style="font-variation-settings: 'FILL' 1;">warning</span>
</div>
</div>
</div>
<!-- Error Text Content -->
<h2 class="font-card-title text-card-title text-on-surface mb-2 px-2">
      We couldn't load your leads
    </h2>
<p class="font-body-sm text-body-sm text-secondary max-w-[280px] mb-6 leading-relaxed">
      Something went wrong while loading your leads. Please check your network and try again.
    </p>
<!-- Diagnostics Snapshot Pill -->
<div class="flex items-center gap-2 px-3 py-1.5 rounded-full bg-surface-container-low mb-6">
<span class="w-2 h-2 rounded-full bg-error"></span>
<span class="font-body-sm text-[12px] text-on-surface-variant font-medium">HTTP 503 • Temporary Timeout</span>
</div>
<!-- Action Buttons -->
<div class="w-full flex flex-col gap-2.5">
<button class="w-full h-12 flex items-center justify-center gap-2 rounded-xl bg-primary-container text-on-primary font-label-btn text-label-btn shadow-md active:scale-[0.98] transition-transform" id="retry-action-btn" type="button">
<span class="material-symbols-outlined text-[20px]" id="retry-icon">refresh</span>
<span id="retry-label">Try Again</span>
</button>
<button class="w-full h-12 flex items-center justify-center gap-2 rounded-xl bg-surface-container-low text-on-surface font-label-btn text-label-btn active:bg-surface-container transition-colors" id="support-action-btn" type="button">
<span class="material-symbols-outlined text-[19px] text-secondary">support_agent</span>
<span>Contact Support</span>
</button>
</div>
</section>
<!-- Helpful Context Tips -->
<section class="mt-4 px-3 py-3 rounded-xl bg-surface-container-low flex items-start gap-3">
<span class="material-symbols-outlined text-[18px] text-primary mt-0.5">info</span>
<div class="flex flex-col text-left">
<span class="font-body-sm text-[12px] font-semibold text-on-surface">Data auto-saves locally</span>
<span class="font-body-sm text-[11px] text-secondary leading-tight">Cached pipeline leads and offline edits are safe and will re-sync immediately.</span>
</div>
</section>
</div>
<script>
  (function() {
    const retryBtn = document.getElementById('retry-action-btn');
    const retryIcon = document.getElementById('retry-icon');
    const retryLabel = document.getElementById('retry-label');

    if (retryBtn && retryIcon && retryLabel) {
      retryBtn.addEventListener('click', function() {
        retryBtn.disabled = true;
        retryIcon.classList.add('animate-spin');
        retryLabel.textContent = 'Connecting...';
        
        setTimeout(function() {
          retryIcon.classList.remove('animate-spin');
          retryLabel.textContent = 'Try Again';
          retryBtn.disabled = false;
        }, 1500);
      });
    }
  })();
</script></main></body></html>
